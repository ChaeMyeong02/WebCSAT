<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채점 결과</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .ans-wrong {color:#dc3545;font-weight:700;}   /* 빨간색 */
        .ans-right {color:#28a745;font-weight:700;}   /* 초록색 */
    </style>
</head>
<body class="d-flex flex-column align-items-center pt-5" style="background:#f8f9fa">

<div class="card p-4" style="min-width:340px;max-width:720px;">
    <h3 class="text-center mb-3">결과</h3>
    <ul class="list-group list-group-flush mb-4">
        <li class="list-group-item">총&nbsp;문제&nbsp;:&nbsp;<b th:text="${total}"></b></li>
        <li class="list-group-item text-success">
            맞춘&nbsp;문제&nbsp;:&nbsp;<b th:text="${correctCnt}"></b></li>
        <li class="list-group-item text-danger">
            오답&nbsp;:&nbsp;<b th:text="${wrongCnt}"></b></li>
    </ul>

    <!-- ▼ 틀린 문제 목록 -->
    <div th:if="${wrongCnt > 0}">
        <h5 class="mb-3">틀린 문제 : 다시 한 번 풀어 보세요</h5>

        <div th:each="row,iter : ${rows}" class="mb-4"
             th:if="${row.selected != row.correct}"> <!-- 틀린 것만 노출하려면 -->

            <div class="fw-bold mb-2"
                 th:text="|Q${iter.index+1}. ${row.q.questionTitle != null ? row.q.questionTitle.replaceAll('<[^>]*>','') : ''}|">
            </div>

            <div th:each="n : ${#numbers.sequence(1,5)}">
                <span th:text="${#strings.substring('①②③④⑤', n-1, n)}"></span>&nbsp;
                <span th:text="${ row.q['option' + n] != null ? row.q['option' + n].replaceAll('<[^>]*>','') : '' }"
                      th:classappend="${
              row.selected == n.toString() ? 'ans-wrong' :
              (row.correct == n.toString()) ? 'ans-right' : ''
          }">
    </span>
            </div>
        </div>


    </div>


    <div class="text-center">
        <a th:href="@{/selectType}" class="btn btn-primary mt-2">처음으로</a>
    </div>
</div>

</body>
</html>
