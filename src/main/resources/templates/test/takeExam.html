<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:inline="javascript">
<head>
    <meta charset="UTF-8">
    <title>시험 응시</title>
    <style>
        html, body { height: 100%; overflow-y: auto; margin: 0; font-family: 'Arial', sans-serif; }
        input[type="radio"] { display: none; }

        .choice-label {
            display: block; padding: 6px 10px; margin-bottom: 0.15rem; /* ✅ 줄임 */
            border: 1px solid #ccc; border-radius: 6px; cursor: pointer; font-size: 0.9rem;
        }
        .choice-label br:first-child { display:none; }
        .choice-label p { display:inline; margin:0; }


        input[type="radio"]:checked + .choice-label {
            background-color: #2980b9; color: white; font-weight: bold;
        }

        .exam-header {
            background: linear-gradient(to right, #9b59b6, #3498db); color: white;
            padding: 1rem; text-align: center;
        }

        .exam-layout {
            display: flex; min-height: 100vh;
        }

        .q-title { margin: 0 0 .4rem; line-height: 1.3; }
        .q-title br:first-child { display: none; }      /* 맨 앞에 <br>가 들어오면 숨김 */
        .q-title p { display:inline; margin:0; }


        /* 문제 영역: 가로로 두 컬럼, 각 컬럼은 세로 스택 */
        .question-section {
          flex: 3;
          display: flex;            /* 좌/우 두 컬럼 */
          gap: 1rem;
          padding: 1rem;
          overflow-y: auto;
          max-height: calc(100vh - 150px);
          border-right: 1px solid #ddd;
          align-items: flex-start;
        }

        .question-col {
          flex: 1 1 0;
          display: flex;
          flex-direction: column;   /* 세로로 쌓기 */
          gap: 1rem;                /* 문제 간 간격 */
          min-width: 0;
        }

        .question-box {
          width: 100%;
          box-sizing: border-box;
          border: 1px solid #ccc;
          padding: 0.75rem;
          font-size: 0.9rem;
          scroll-margin-bottom: 7rem;  /* 하단바 높이만큼 여유(취향껏 6~9rem) */
        }

        .question-box * { margin: 0; line-height: 1.3; }
        .question-box p { margin-bottom: 0.4rem; }
        .question-box img { display: block; max-width: 100%; height: auto; }

        .article-box {
          background: #f8f9fa;
          border-left: 4px solid #2980b9;
          box-shadow: 0 2px 6px rgba(0,0,0,0.1);
          border-radius: 6px;
          padding: 1rem;
          margin: 0 0 0.5rem 0;   /* 불필요한 큰 여백 방지 */
        }

        .omr-section {
            flex: 1; background-color: #f9f9f9; color: #333;
            padding: 1rem; overflow-y: auto;
            max-height: calc(100vh - 100px); border-left: 1px solid #ccc;
        }

        .omr-line { margin-bottom: 0.5rem; font-size: 0.9rem; }
        .omr-line button {
            margin: 0 3px; padding: 3px 8px; border: none;
            border-radius: 3px; background: white; color: #333; cursor: pointer;
        }

        .omr-line button.selected {
            background: #2980b9; color: white; font-weight: bold;
        }

        .submit-btn {
            text-align: center; padding: 1rem;
        }

        .pagination { text-align: center; margin-top: 1rem; }

        .fixed-pagination {
            position: sticky;      /* ← fixed 대신 sticky */
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 0.75rem 1rem;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;      /* ⬅️ 세로 정렬 */
            align-items: center;         /* 가운데 정렬 */
            gap: .6rem;                  /* 위아래 간격 */
            justify-content: center;
            z-index: 10;
        }

        /* 페이지네이션 버튼 줄 간격/정렬 */
        .fixed-pagination .pagination {
          display: flex;
          align-items: center;
          gap: .75rem;
          margin: 0;
        }

        /* 제출 버튼(하단)만 보기 좋게 */
        .fixed-pagination > button {
          width: min(320px, 90%);      /* 모바일에서도 보기 좋게 */
          padding: .6rem 1rem;
          font-weight: 700;
        }

        /* 고정 하단바에 가려지지 않도록 문제 영역 하단 여백 추가(필요시) */
        .question-section {
          padding-bottom: 1rem;        /* 마지막 문제/보기 가림 방지 */
        }

        /* --- loading overlay --- */
        .loading-overlay {
          position: fixed;
          inset: 0;
          display: none;                 /* 기본 숨김 */
          align-items: center;
          justify-content: center;
          background: rgba(0,0,0,.45);
          backdrop-filter: blur(1.5px);
          z-index: 20000;                /* 페이지 최상단 */
        }
        .loading-overlay.show { display: flex; }

        .loading-box {
          background: #fff;
          color: #111;
          border-radius: 12px;
          padding: 1.25rem 1.5rem;
          min-width: 260px;
          text-align: center;
          box-shadow: 0 10px 30px rgba(0,0,0,.25);
        }
        .spinner {
          width: 44px; height: 44px;
          border: 4px solid #e5e7eb;
          border-top-color: #2980b9;
          border-radius: 50%;
          animation: spin .9s linear infinite;
          margin: 0 auto .75rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
</style>
    <script th:inline="none">
        window.MathJax = {
          tex: { inlineMath: [ ['$', '$'], ['\\(', '\\)'] ],
                 displayMath: [ ['$$','$$'], ['\\[','\\]'] ] },
          svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" defer></script>
</head>
<body>

<div class="exam-header">
    <h2 th:text="${subjectName} + ' - ' + ${subclassName} + ' - ' + ${csatDate}">시험 제목</h2>
    <p>남은시간: <span id="timer">50:00</span></p>
</div>

<div id="time-warning" style="display:none; position:fixed; top:0; left:0; width:100%; background:#f39c12; color:white; text-align:center; padding:0.5rem; font-weight:bold; z-index:9999;">
    시험 종료까지 5분 남았습니다.
</div>

<form id="examForm" action="/submitExam" method="post">
    <input type="hidden" id="elapsedTime" name="elapsedTime" value="0" />
    <input type="hidden" name="subclassId" th:value="${subclassId}" />
    <input type="hidden" name="csatDate" th:value="${csatDate}" />
    <input type="hidden" name="jwtToken" th:value="${jwt}" />

    <div id="hiddenStore" aria-hidden="true" style="display:none;"></div>


    <div class="exam-layout">
        <div id="questionContainer" class="question-section">
            <div id="colL" class="question-col"></div>
            <div id="colR" class="question-col"></div>
        </div>



        <div class="omr-section">
            <h4>답안지</h4>
            <div id="omrContainer"></div>
        </div>
    </div>

    <div class="submit-btn fixed-pagination" id="examFooter">
        <div class="pagination">
            <button type="button" onclick="prevPage()">이전</button>
            <span id="pageInfo">1 / 1</span>
            <button type="button" onclick="nextPage()">다음</button>
        </div>
        <button type="button" onclick="checkBeforeSubmit()">시험 제출</button>
    </div>
</form>

<script th:inline="javascript">
    window.__EXAM__ = {
      questions: JSON.parse(/*[[${questionsJson}]]*/ '[]'),
      articleRangeMap: JSON.parse(/*[[${articleRangeMapJson}]]*/ '{}'),
      examTimeSeconds: (/*[[${examTimeMinutes}]]*/ 50) * 60
    };
</script>
<script src="/js/exam.js" defer></script>

<!-- 제출/로드 중 오버레이 -->
<div id="loadingOverlay" class="loading-overlay" role="alert" aria-live="polite" aria-busy="true">
    <div class="loading-box">
        <div class="spinner"></div>
        <div id="loadingText">답안을 제출하고 있어요…</div>
    </div>
</div>
<script>
    (function(){
      function applyFooterGuard(){
        const footer = document.getElementById('examFooter');
        const header = document.querySelector('.exam-header');
        const fh = footer ? Math.ceil(footer.getBoundingClientRect().height) : 0;
        const hh = header ? Math.ceil(header.getBoundingClientRect().height) : 0;
        document.documentElement.style.setProperty('--footer-h', fh + 'px');
        document.documentElement.style.setProperty('--header-h', hh + 'px');
      }

      // 초기/리사이즈 시 반영
      window.addEventListener('load', applyFooterGuard);
      window.addEventListener('resize', applyFooterGuard);

      // 페이지 이동 후에도 반영되도록 prev/next monkey patch
      const origPrev = window.prevPage;
      const origNext = window.nextPage;
      if (typeof origPrev === 'function') {
        window.prevPage = function(){ origPrev(); applyFooterGuard(); };
      }
      if (typeof origNext === 'function') {
        window.nextPage = function(){ origNext(); applyFooterGuard(); };
      }
    })();
</script>
</body>
</html>
