<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시험 통계</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body {
          min-height: 100vh;
          background: linear-gradient(to right, rgba(155, 89, 182, 1), rgba(52, 152, 219, 1));
          color:#0f172a;
        }
        body[data-mode="mine"] [data-role="admin-only"],
        body[data-mode="mine"] #distCard {
          display: none !important;
        }
        body[data-mode="one"] #adminSection { display: none !important; }

        .card {
          background: rgba(255,255,255,0.92);
          border: 1px solid rgba(255,255,255,0.45);
          box-shadow: 0 10px 30px rgba(0,0,0,0.12);
          backdrop-filter: blur(4px);
        }
        .form-select, .form-control { background:#ffffff; color:#0f172a; border-color:#cbd5e1; }
        .form-select:focus, .form-control:focus { box-shadow:none; border-color:#64748b; }
        .muted { color:#475569; }
        .kpi { font-size:1.65rem; font-weight:700; color:#0b1220; }
        .chart-wrap { position:relative; height:360px; }
        .divider { border-bottom:1px dashed rgba(15,23,42,0.25); margin:1.25rem 0; }
        .btn-primary { background:#2563eb; border-color:#2563eb; }
        h2, h5 { color:#0b1220; }
        label.form-label { font-weight:600; color:#0b1220; }

        #scoresModal .modal-title {
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          max-width: 100%; /* 혹시 버튼 옆 X 아이콘 때문에 잘릴 수 있으니 */
        }
        #monthStrip .btn { min-width: 52px; }
#monthStrip .btn-light { box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    </style>
</head>
<body data-user-id="[[${userId}]]" data-mode="[[${mode}]]">
<th:block th:replace="~{fragments/commonHeader :: header}"></th:block>
<!-- 월별 오버뷰 열기 버튼(원하는 위치에 배치해도 됨) -->
<button id="btnOverview" class="btn btn-outline-dark btn-sm" style="position:fixed; right:16px; top:92px; z-index:1100;">
    모의고사별 오버뷰
</button>

<!-- 월별 오버뷰 모달 -->
<div class="modal fade" id="overviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">모의고사별 성적 오버뷰</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3 align-items-end mb-2">
                    <div class="col-12 col-lg-4">
                        <label class="form-label">모의고사 회차(CSAT)</label>
                        <select id="ovMonth" class="form-select">
                            <option value="">회차 선택</option>
                        </select>
                    </div>
                    <!-- 관리자만 유저 선택 노출 -->
                    <div class="col-12 col-lg-4" id="ovUserWrap" style="display:none;">
                        <label class="form-label">사용자</label>
                        <select id="ovUser" class="form-select">
                            <option value="">사용자 선택</option>
                        </select>
                    </div>
                    <div class="col-12 col-lg-4 d-flex gap-2">
                        <button id="ovFetch" class="btn btn-primary flex-grow-1">불러오기</button>
                        <a id="ovToStatsTop" href="#" class="btn btn-outline-dark btn-sm">상세 통계로</a>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                        <tr>
                            <th style="min-width:140px;">과목</th>
                            <th style="min-width:160px;">세부과목</th>
                            <th class="text-end">평균 점수</th>
                            <th class="text-end">백분위</th>
                            <th class="text-end">표준점수</th>
                            <th class="text-end"></th>
                        </tr>
                        </thead>
                        <tbody id="ovTbody">
                        <tr><td colspan="6" class="text-center text-muted py-4">회차를 선택하고 불러오기를 눌러주세요.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 등급표(컷/표준점수) 모달 -->
<div class="modal fade" id="cutModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="cutModalTitle">등급표</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="cutSummary" class="mb-2"></div>
                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead>
                        <tr>
                            <th>등급</th>
                            <th>원점수 컷</th>
                            <th id="stdHead" style="display:none;">표준점수 컷</th>
                        </tr>
                        </thead>
                        <tbody id="cutTbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>


<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">시험 통계</h2>
<!--        <div class="muted small">사용자: <span id="userLabel">[[${username}]]</span></div>-->
    </div>

    <!-- Filters -->
    <!-- 사용자 선택 (MODE===one 일 때만 보임) -->
    <div id="userSelectorRow" class="row g-3 align-items-end justify-content-center mb-2" style="display:none;">
    <div class="col-12 col-lg-4 mx-auto">  <!-- ✅ 한 칸일 땐 mx-auto로 중앙 -->
            <label class="form-label">사용자</label>
            <select id="userSelect" class="form-select">
                <option value="">사용자 선택</option>
            </select>
        </div>
    </div>


    <div class="card mb-4">
        <div class="card-body">
            <div id="filterRow"
                 class="row g-3 align-items-end justify-content-center">
                <div class="col-12 col-lg-3">
                    <label class="form-label">과목(Subject)</label>
                    <select id="subjectId" class="form-select">
                        <option value="">과목 선택</option>
                    </select>
                </div>
                <div class="col-12 col-lg-3">
                    <label class="form-label">세부과목(Subclass)</label>
                    <select id="subclassId" class="form-select" disabled>
                        <option value="">세부과목 선택</option>
                    </select>
                </div>
                <div class="col-12 col-lg-3">
                    <label class="form-label">모의고사 회차(CSAT)</label>
                    <select id="csatDate" class="form-select" disabled>
                        <option value="">회차 선택</option>
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-center align-items-center mt-3 gap-2">
                <button id="btnReview" class="btn btn-outline-dark">리마인드 보기</button>
                <button id="refreshAll" class="btn btn-primary">검색</button>
            </div>
            </div>
        </div>
    </div>

    <!-- KPI cards -->
    <div class="row g-3 mb-4 justify-content-center" id="kpiRow">
        <div class="col-6 col-lg-3" data-role="admin-only">
            <div class="card p-3 h-100">
                <div class="muted">응시자 수</div>
                <div id="kpiParticipants" class="kpi">-</div>
                <div class="muted small">선택된 회차·과목 기준</div>
            </div>
        </div>

        <div class="col-6 col-lg-3">
            <div class="card p-3 h-100">
                <div class="muted">총 응시 수</div>
                <div id="kpiAttempts" class="kpi">-</div>
                <div class="muted small">중복 포함</div>
            </div>
        </div>

        <div class="col-6 col-lg-3">
            <div class="card p-3 h-100">
                <div class="muted">평균 점수</div>
                <div class="kpi"><span id="kpiAvg">-</span></div>
                <div class="muted small">점수 기준</div>
            </div>
        </div>

        <div class="col-6 col-lg-3">
            <div class="card p-3 h-100">
                <div class="muted">등급</div>
                <div id="kpiCut1" class="kpi">-</div>
                <div class="muted small">가장 최근에 응시한 시험 기준</div>
            </div>
        </div>
    </div>

    <div class="divider"></div>

<!-- Trend chart -->
<div class="card mb-4" id="trendCard">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 id="trendTitle" class="mb-0">내 점수 추이</h5>
            <span id="trendInfo" class="muted small"></span>
        </div>
        <div class="chart-wrap"><canvas id="trendChart"></canvas></div>

        <!-- ✅ AI 학습 조언 버튼 추가 -->
        <div class="text-center mt-3">
            <button id="aiAdviceBtn" class="btn btn-outline-primary">
                🧠 AI 학습 조언 보기
            </button>
        </div>

        <!-- ✅ AI 결과 표시 박스 (기존 코드 유지) -->
        <div id="aiAdviceBox" class="alert alert-secondary mt-3" style="white-space:pre-wrap;"></div>
    </div>
</div>

    <!-- Distribution chart -->
    <div class="card mb-4" id="distCard" data-role="admin-only">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="mb-0">점수 분포</h5>
                <span id="distInfo" class="muted small"></span>
            </div>
            <div class="chart-wrap"><canvas id="distChart"></canvas></div>

            <div class="divider my-3" id="gradeDivider" style="display:none;"></div>

            <div id="gradeBlock" style="display:none;">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="mb-0">등급 분포(컷 기준)</h6>
                    <span id="gradeInfo" class="muted small"></span>
                </div>
                <div class="chart-wrap" style="height:280px">
                    <canvas id="gradeChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin area -->
    <div class="card mb-4" id="adminSection" data-role="admin-only">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="mb-0">관리자 지표 — 재응시율</h5>
            </div>
            <div class="row g-3">
                <div class="col-6 col-lg-3">
                    <div class="muted">재응시율</div>
                    <div id="adminRetakeRate" class="kpi">-</div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="muted">총 응시자</div>
                    <div id="adminParticipants" class="kpi">-</div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="muted">2회 이상 응시자</div>
                    <div id="adminReusers" class="kpi">-</div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="muted">유저당 평균 시도</div>
                    <div id="adminAvgAttempts" class="kpi">-</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Attempts Modal (리마인드 목록) -->
<div class="modal fade" id="attemptsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="attemptsModalTitle">리마인드 — 내 응시 목록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th>응시일</th><th>회차</th><th>세부과목</th><th class="text-end">점수</th><th></th>
                    </tr>
                    </thead>
                    <tbody id="attemptTbody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="/js/overview.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/stats.js"></script>
</body>
</html>
