<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>회차 선택 · 성적 요약</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body { background: linear-gradient(90deg,#9b59b6,#3498db); min-height:100vh; }
        .card { background: rgba(255,255,255,.94); border:1px solid rgba(255,255,255,.45); box-shadow:0 10px 30px rgba(0,0,0,.12); }
        .pill { font-size:.75rem; padding:.15rem .5rem; border-radius:999px; background:#e2e8f0; color:#0f172a; }
        .muted { color:#475569; }
        .empty { color:#64748b; padding:2rem 0; text-align:center; }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="text-white mb-0">응시 회차 선택</h3>
        <a id="toStats" href="/stats/user" class="btn btn-outline-light btn-sm">상세 통계로</a>
    </div>

    <div class="card mb-3">
        <div class="card-body row g-3 align-items-end">
            <div class="col-12 col-lg-4">
                <label class="form-label">모의고사 회차(CSAT)</label>
                <select id="csatDate" class="form-select">
                    <option value="">회차 선택</option>
                </select>
            </div>

            <!-- 관리자일 때만 노출 -->
            <div id="userWrap" class="col-12 col-lg-4" style="display:none;">
                <label class="form-label">사용자</label>
                <select id="userSelect" class="form-select">
                    <option value="">사용자 선택</option>
                </select>
            </div>

            <div class="col-12 col-lg-4 d-flex gap-2">
                <button id="btnFetch" class="btn btn-primary flex-grow-1">요약 불러오기</button>
                <a id="btnToStats" class="btn btn-outline-secondary" href="/stats/user">상세</a>
            </div>
        </div>
    </div>

    <div id="summary" class="row g-3"></div>
    <div id="empty" class="empty d-none">표시할 응시가 없습니다. 회차를 바꿔보세요.</div>
</div>

<script src="/js/overview.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
